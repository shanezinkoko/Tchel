<body class="">

    <div class="mx-200 my-23 text-center text-space-around pb-3 py-5">
            <h4 class="inline text-left px-20 font-bold">HIT MYANMAR.</h4>
            <h5 class="inline px-20">DESIGN/004</h5>
    </div>
    
    <div class="mx-auto w-96 h-96 relative  transition-all z-0">
        
        <div class="group hover:-translate-x-1 hover:-translate-y-1 transition-all">
            <div class="relative border-2 border-black w-96 bg-yellow-400 mx-auto rounded-md rounded-b-none"> 
            <div class="border border-black bg-pink-400 w-48 h-48 rounded-full mx-auto my-20 group-hover:scale-125 transition-all group-hover:bg-green-400 group-hover:-rotate-12">
                <div>
                    <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f45f.svg" alt="" class="-rotate-6">
                </div>
            </div>

            <div class="">
                <p class="absolute top-4 right-4 border border-black w-[70px] h-[30px] bg-green-400 group-hover:bg-pink-400 text-xs font-bold text-center skew-y-12 group-hover:-skew-y-12 transition-all p-1">HITCAMP!</p>

                 <i class="fa-solid fa-plus w-7 h-7 absolute bottom-6 left-6 text-2xl font-black"></i>
            </div>
        </div>
        <div class=" w-96 pb-8 border-2 border-black bg-white mx-auto rounded-md rounded-t-none">
            <p class="text-purple-500 text-xs text-bold p-4">BIG STEPS. GOOD ENERGY</p>
            <p class="text-black font-extrabold text-5xl px-5">MAKE</p>
            <p class="text-black font-extrabold text-5xl px-5 mb-5">YOUR MOVE.</p>

            <p class="px-5 text-xs">A playful sneaker concept for colorful days</p>
            <p class="px-5 text-xs mb-5">spontaneous plans,ans your own kind of style.</p>
            
            <div class="flex mx-5">

                <div class="border border-black-400 bg-yellow-400 w-5 h-5 rounded-full mx-1"></div>
                <div class="border border-black-400 bg-green-400 w-5 h-5 rounded-full mx-1"></div>
                <div class="border border-black-400 bg-pink-400 w-5 h-5 rounded-full mx-1"></div>
            </div>
            <br>
            <div class="border-2 border-b-black mx-5"></div>
            <br>
            <div class="flex justify-between">
                <p class="text-sm mx-5 font-bold">GO YOUR OWN WAY</p>
                <i class="fa-solid fa-arrow-right-long"></i>
                <br>
            </div>
            
        </div>
        </div>

        <div class="absolute top-2 border-2 border-black w-[380px] h-[705px] bg-black mx-auto rounded-md px-5 left-3 -z-10 ">

            </div>

        <div class="mt-7">
